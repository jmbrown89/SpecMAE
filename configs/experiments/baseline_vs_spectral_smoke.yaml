base_config: configs/medmnist_2d.yaml
artifacts_root: outputs/runs
results_root: outputs/experiments
run_prefix: baseline_vs_spectral_smoke
cleanup_outputs:
  run_artifacts: true
  result_files: true

seeds: [7]

shared_overrides:
  dataset: pneumoniamnist
  epochs: 2
  batch_size: 16
  limit_samples: 64
  checkpoint_every: 1
  save_examples_every: 1
  early_stopping: false
  restore_best_at_end: true

conditions:
  - name: spectral_fixed_070
    overrides:
      pretext_method: spectral
      curriculum_mode: none
      mask_policy: high_frequency_first
      mask_ratio: 0.70

  - name: spectral_linear_025_070
    overrides:
      pretext_method: spectral
      curriculum_mode: linear
      mask_policy: high_frequency_first
      curriculum_mask_start: 0.25
      curriculum_mask_end: 0.70

  - name: image_patch_fixed_070
    overrides:
      pretext_method: image_patch
      image_patch_size: 4
      curriculum_mode: none
      mask_policy: random
      mask_ratio: 0.70

  - name: image_patch_linear_025_070
    overrides:
      pretext_method: image_patch
      image_patch_size: 4
      curriculum_mode: linear
      mask_policy: random
      curriculum_mask_start: 0.25
      curriculum_mask_end: 0.70
