dataset:
  name: pneumoniamnist
  root: data/raw
  image_size: 28

training:
  batch_size: 32
  epochs: 30
  learning_rate: 0.001
  # limit_samples: 256
  num_workers: 0
  device: cpu
  seed: 7

masking:
  policy: high_frequency_first
  mask_ratio: 0.6

curriculum:
  mode: linear
  mask_ratio_start: 0.25
  mask_ratio_end: 0.70

loss:
  kind: mse
  mse_weight: 1.0
  l1_weight: 1.0

artifacts:
  root: outputs/runs
  run_name: long_stable_linear_no_limit
  save_checkpoints: true
  checkpoint_every: 5
  save_examples_every: 5
  examples_dir: ""

early_stopping:
  enabled: true
  patience: 5
  min_delta: 0.00001

evaluation:
  restore_best_at_end: true
